name: continuous-integration

on:
  push:
    branches:
      - master
      - releases/*
  pull_request: null
  workflow_dispatch:
    inputs:
      source-ref:
        description: 'Source commit to check out for validation'
        required: false
        type: string
      python-version:
        description: 'Python version to test (leave empty for all)'
        required: false
        type: string
      os:
        description: 'OS to test on'
        required: false
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
        default: 'all'

# Cancel redundant builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_NUMBER: 0  # increase to reset cache manually
  CONDA_ENV: .github/environment.yml

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el -o pipefail {0}

    permissions:
      contents: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event.inputs.os == 'all' || github.event.inputs.os == '') && fromJSON('["macos-latest", "ubuntu-latest"]') || fromJSON(format('["{0}"]', github.event.inputs.os)) }}
        python-version: ${{ github.event.inputs.python-version != '' && fromJSON(format('["{0}"]', github.event.inputs.python-version)) || fromJSON('["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
        include:
          - os: macos-latest
            label: osx-64
            prefix: /Users/runner/miniconda3

          - os: ubuntu-latest
            label: linux-64
            prefix: /usr/share/miniconda3

    steps:

      - name: Checkout CCL repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source-ref || github.sha }}

      - name: Record tested commit
        run: git rev-parse HEAD

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          channels: conda-forge
          conda-remove-defaults: true
          show-channel-urls: true
          miniforge-version: latest
          miniforge-variant: Miniforge3
          python-version: ${{ matrix.python-version }}

      - name: "macOS: set env variables"
        if: matrix.label == 'osx-64'
        run: |
          echo "DYLD_FALLBACK_LIBRARY_PATH=${CONDA_PREFIX}/lib" >> $GITHUB_ENV
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDKROOT: ${SDKROOT}"
          echo "SDKROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "CONDA_BUILD_SYSROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "CFLAGS=-I/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib" >> $GITHUB_ENV

      - name: Set current date as environment variable
        run: echo "TODAY=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Get cached environment
        uses: actions/cache@v5
        id: cache
        with:
          path: ${{ matrix.prefix }}
          key:
            conda-py${{ matrix.python-version }}-${{
            matrix.os }}--${{
            hashFiles(env.CONDA_ENV) }}-${{
            hashFiles('setup.py') }}--${{
            env.TODAY }}-${{
            env.CACHE_NUMBER }}

      - name: Install environment packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export MAMBA_NO_BANNER=1  # hide mamba banner from output
          mamba env update --file ${{ env.CONDA_ENV }} --prune

      - name: Rebuild and verify the ISiTGR native library
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tarfile
          import tempfile
          import urllib.request

          version = importlib.metadata.version('isitgr')
          if version != '1.6.5':
              raise RuntimeError('Recheck the native build for ISiTGR ' + version)
          expected = '87890cd59c7befa5d244dee6598ef6ceccd099210dd86547951cf87b682fe366'
          with urllib.request.urlopen('https://pypi.org/pypi/isitgr/1.6.5/json') as response:
              metadata = json.load(response)
          source = next(item for item in metadata['urls']
                        if item['packagetype'] == 'sdist')
          with urllib.request.urlopen(source['url']) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError('ISiTGR source archive checksum mismatch')
          with tempfile.TemporaryDirectory(prefix='isitgr-build-') as temporary:
              root = pathlib.Path(temporary)
              archive_path = root / 'isitgr.tar.gz'
              archive_path.write_bytes(data)
              with tarfile.open(archive_path) as archive:
                  archive.extractall(root, filter='data')
              source_path = root / 'isitgr-1.6.5'
              # The sdist contains an ELF library. Removing it also ensures
              # a failed compilation cannot be accepted as a valid build.
              (source_path / 'isitgr/isitgrlib.so').unlink()
              env = os.environ.copy()
              env['LIBRARY_PATH'] = os.pathsep.join(filter(None, (
                  env['CONDA_PREFIX'] + '/lib',
                  env['SDKROOT'] + '/usr/lib', env.get('LIBRARY_PATH'))))
              subprocess.run([
                  sys.executable, '-m', 'pip', 'install', '--verbose',
                  '--no-deps', '--no-build-isolation', '--no-cache-dir',
                  '--force-reinstall', str(source_path)], check=True, env=env)
          subprocess.run([sys.executable, '-c',
                          'import isitgr; print(isitgr.__version__)'], check=True)
          PY

      - name: Get pip cache dir
        id: pip-cache
        run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: pip-py${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('**/environment.yml') }}-${{ hashFiles('setup.py') }}
          restore-keys: |
            pip-py${{ matrix.python-version }}-${{ runner.os }}-
            pip-${{ runner.os }}-

      - name: Install CCL
        run: pip install -v -e .

      - name: Full compilation (to run C-level benchmarks)
        run: |
          cmake -H. -Bbuild -DPYTHON_VERSION=0.0.0
          make -Cbuild all
          ./build/check_ccl

      - name: Unit tests
        run: |
          OMP_NUM_THREADS=2 pytest -vv pyccl --cov=pyccl --cov-report=lcov:lcov.info

      - name: Benchmarks
        run: |
          OMP_NUM_THREADS=2 pytest -vv benchmarks --cov=pyccl --cov-report=lcov:lcov.info --cov-append

      - name: Code coverage
        if: matrix.label == 'linux-64'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: lcov.info

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout CCL repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source-ref || github.sha }}

      - name: Lint
        uses: py-actions/flake8@v2
        with:
          args: "--config .flake8"
